# Car object of the race overlay (ovl0), US Simulation v1.2 (EXE SHA-1 3030aa27...).
# Facts only; every entry says how it was established. Tools: gt2run car-probe / watch / calltrace.

array:
  base: 0x800A9688          # car 0; established from position hits 0x800A9EB8 - 0x830
  stride: 0xB40             # 2880 bytes; cars 0..3 found at 0x800A9EB8, 0x800AA9F8, 0x800AB538, 0x800AC078 (attract race)
  location: resident EXE data/bss (not inside the overlay)
  evidence: >
    car-probe (2026-09-18): scene-extractor world positions of 4 visible cars matched 16.16 X/Z pairs at these
    addresses within one frame of motion; spacing between consecutive cars is constant.

fields:
  - offset: 0x688           # 1672
    name: body_position
    type: s32[3]
    units: 1/4096 m, physics axes (x, y, z) -> world (x, z, -y)
    evidence: >
      0x8001336C(dst = car + 0x81C, src = car + 0x688) copies src[0], src[2], -src[1] shifted left by 4 into dst + 0x14
      (the 16.16 world position), and converts the s16 3x3 matrix at src + 0x0C with the same axis swap.
      watch: written by pc 0x80033EC0 (function 0x80033E6C, called from 0x8003437C) three times per frame.
  - offset: 0x694           # 0x688 + 0x0C
    name: body_rotation
    type: s16[3][3]
    units: 4096 = 1.0
    evidence: watch - written by 0x80044F90..0x8004506C and helper 0x80075968 every frame.
  - offset: 0x6AC           # 1708
    name: second_transform_source   # converted by the same 0x8001336C into car + 0x83C; role unknown
    type: same layout as 0x688
  - offset: 0x81C           # 2076
    name: render_transform
    type: "{ s16 rotation[3][3]; s16 pad; s32 position[3] at +0x14 }"
    units: position 16.16 m world
  - offset: 0x830           # 2096 = 0x81C + 0x14
    name: world_position
    type: s32[3]
    units: 16.16 m, world axes (same space as the course chunks)
    evidence: car-probe hit; watch - written by 0x80013378.. (conversion) and 0x80013514.. (offset added after 0x800814B4)
  - offset: 0x85C           # 2140
    name: previous_world_position
    type: s32[3]
    evidence: 0x800133F0 copies world_position here before updating it

