  - { offset: 0x004, name: carWork, type: "CarWork[6] (0x90 bytes each)", note: "4 wheel records of 0x1C bytes (+0x18 sin, +0x1A cos of the wheel steer angle), then +0x78 engine speed at clutch start, +0x7C engine speed from wheels, +0x80 inverse effective mass, +0x84 rolling resistance, +0x88 clutchEngagement, +0x8C/+0x8E s16 slide measures (0x8003DBE8 reads them; tyres.h CarScratch / drive_shafts.h DriveCarWork carry these names since 2026-09-19). Phase 4 (0x80043388..) reuses the area with 0x60 per car / 0x18 per wheel contact-query records." }
  - { offset: 0x0B4, name: displacement, type: "s32[6][4]", note: "x, y, height (1/4096 m), heading; written by 0x80030330 at the very end of 0x8003E0C4, consumed by 0x80034320", evidence: watch 2026-09-18 }
  - { offset: 0x364, name: inputWord, type: "s32[6]", evidence: "0x8002FB18 writes, 0x8003991C reads" }

tick:                          # 0x8003EBF0 (once per frame): 0x8003E0C4 (forces/velocities) -> 0x80034480 (move + collide) -> 0x80043388, 0x800434DC, 0x80043578, 0x8003E8E4, 0x8003CF94, 0x8003D168 -> render transforms
  physics_core: 0x8003E0C4   # per car: 0x8004232C step time, 0x8003DAA8 aero, curve lookups, 0x80039A4C/0x80039DE8 tyres, input 0x8003C250 -> 0x8003E020 -> 0x8002FB18 (player) / 0x80038540 (AI), wheel angles, 0x80039778, slip work, 0x80039FC8 (tyre forces, calls 0x80046B58 suspension), engine 0x8003DE68 / 0x8003DBE8, 0x80030330 displacement

