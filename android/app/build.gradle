plugins { id 'com.android.application' }
android {
    namespace 'io.github.gt2pc.quest'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'io.github.gt2pc.quest'
        minSdk 32
        targetSdk 32
        versionCode 16
        versionName '0.4.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DBUILD_TESTING=OFF'; targets 'gt2game' } }
    }
    // Quest sideload target; Google Play publication rules do not apply.
    lint { disable 'ExpiredTargetSdkVersion' }
    buildFeatures { prefab true }
    externalNativeBuild { cmake { path file('../../CMakeLists.txt'); version '3.22.1' } }
    buildTypes {
        debug {
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo' } }
        }
        release {
            debuggable false
            minifyEnabled false
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
    }
}
dependencies { implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.43' }
