# Facts about SCUS_944.88 (US Simulation v1.2), EXE SHA-1 3030aa271c0a4022fc69ce09d76a6bc75e69a32a.
# Every entry: address, what it is, how it was established (status: verified = reproduced by our own tooling).

- address: 0x80082FAC
  name: gzip_inflate
  signature: "int gzip_inflate(const u8* gzipMember, u8* dst)"
  status: verified
  evidence: >
    tools/gt2run inflate-test (2026-09-18): executed in our R3000 interpreter with a0 = pointer to the gzip
    member (header included) and a1 = dst; output is byte-identical to the host inflate for all six GT2.OVL
    members (14.0 M guest instructions in total). Needs no BIOS, no I/O and no prior initialisation.
  notes: >
    Resolves an address conflict: the CC0 symbol gzip_decompress = 0x800847D0 from
    gt2-reversing does NOT behave as the inflate entry point on our EXE (unmapped read / address error when
    called with the same arguments), so that symbol file must be checked against control points before import.

