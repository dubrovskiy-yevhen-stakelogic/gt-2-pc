- address: 0x80087B94
  name: pad_step
  status: verified
  evidence: >
    Dispatches step table 0x800A7724 (0x80088BF4 send 0x01, 0x80088C3C send 0x42 / config, 0x80088D14 read id
    (0x800A7718 = (id & 0xF) * 2 data bytes), 0x80088DC0 read 0x5A, 0x80088EDC read data); after each step
    0x80088124 (I_STAT = ~0x80, wait JOY_STAT.7 == 0, JOY_CTRL |= 0x10); error -> 0x80089630.

- address: 0x80087C84
  name: pad_xfer_byte_edge
  status: verified
  evidence: >
    param < 0: first byte (waits JOY_STAT.0, the timer-2 delay, writes ~param = 0x01). Otherwise: wait JOY_STAT.1,
    read JOY_DATA into rx[+0x44], JOY_BAUD = 0x88 (0x22 for multitap data), wait I_STAT.7 (timeout 0x1AE ticks,
    -0x14 on timeout), write the next TX.

