  sim_address: 0x800A9688
  status: observed
  evidence: >
    Six 0xB40-byte car slots (Sim 0x800A9688, same stride); the arcade race dump work\re\arcade_race\ram.bin has the car
    headers there (pointer at +0 into the array, same layout as the Sim dumps). Delta -0x310 = the delta of the
