# Facts about SCUS_944.55 (US Arcade v1.1, "ARCADE MODE DISC"), EXE SHA-1 231f9dba7191b9ef915621662afdc40a7c66df95.
# Every entry: address in THIS build, what it is, how it was established. Status "observed" = seen in our own runs of
# the original in the interpreter (gt2run session / calltrace logs under work\re\arcade_*); "mapped" = derived from the
# US Simulation v1.2 entry (db/sim_us12_symbols.yaml, EXE SHA-1 3030aa271c0a4022fc69ce09d76a6bc75e69a32a) by
# gt2tool exe-map (instruction-level comparison modulo relocations, docs/research/arcade_disc.md section 5).
# Overlay addresses are valid while the named GT2.OVL member is loaded at 0x80010000.
#
# Files (SHA-1 of the files as stored on the disc, extracted by tools/Gt2Disc; GT2.OVL members inflated):
#   SCUS_944.55 231f9dba7191b9ef915621662afdc40a7c66df95   GT2.OVL e2a4d8e905224d6534c54887d08f0076e32decfa
#   GT2.VOL     972c7a65e0cf3c43cce84b219a84da88d98cbdfd   (10618 files; every path also exists on the Sim disc)
#   ovl0 7360263f7c37eeac154e14d17d923287fe46b28f  ovl1 20bb63ff66247bafc19cf1e9d939c90aa0871e2d
#   ovl2 304ee2b35f0b3dc430394cbfbe14f670a3353cf3  ovl3 d31f01582a5c37f0a661fa378dfb62526d11ea23
#   ovl4 5339c790770cd9c93ee4ca4cc8b468cb19b49fe3  ovl5 c40ec257e8e9b163394827a87599046aa6e3fc7c
# PS-X EXE header: pc0 0x8005D570, t_addr 0x80010000, t_size 0x99000 (docs/research/scout_exe.md section 2).

# ---- shell and loaders (hand-established, 2026-09-19)

- address: 0x80090EB8
  name: overlay_entry_table
  status: verified
  evidence: >
    Six overlay entry points (scout_exe.md section 4): ovl0 0x80012254, ovl1 0x800112D0, ovl2 0x80011750, ovl3 0x80012C00,
    ovl4 0x80013628, ovl5 0x800114B8. 0x8005D9AC reads it (lui 0x8009 / addiu 0x0EB8, Sim 0x80091174). The a1 values
    of the 0x8005DA48 calls in our session equal these entries.

- address: 0x8005D9AC
  name: overlay_select
  sim_address: 0x8005DA3C
  status: observed
  evidence: >
    gt2run session (calls=8005D9AC+8005DA48, work\re\arcade_boot / arcade_nav): f476 a0 = 5 (from main 0x8005D670),
    f606 a0 = 1 (from ovl5 0x800114C8, after Start skipped the intro movie), f1321 a0 = 2 (from ovl1 0x80011434),
    f4267 a0 = 3 (from ovl2 0x80011924, a1 = 0x801D5CD0). Same code as Sim 0x8005DA3C modulo relocations.

- address: 0x8005DA48
  name: overlay_load
  sim_address: 0x8005DAD8
  status: observed
  evidence: >
    (member, entry): inflates GT2.OVL[member] to 0x80010000 and enters it. Called by 0x8005D9AC with the table
    entry, and at f4329 directly from ovl3 with (0, 0x80011F64): the arcade race enters the race overlay at the same
    entry as the Sim disc's race (0x80011F64, db/sim_us12_symbols.yaml race_overlay_entry). The RAM dump at f5500
    holds ovl0 at 0x80010000 (79166 of 79194 words equal to the inflated member; the rest is runtime data).

- address: 0x8005D7B8
  name: vol_load_file
  sim_address: 0x8005D848
  status: observed
  evidence: >
    (file number, dst): reads one GT2.VOL file; a0 = entry of the VOL offset table (GtfsEntry::index, gt2tool
    vol-index). Offset table pointer 0x801E3020 (Sim 0x801E35F0). All 42 calls from boot to the race start of
    work\re\arcade_files resolve to existing paths (docs/research/arcade_disc.md section 3).

- address: 0x8005D810
  name: vol_load_slot
  sim_address: 0x8005D8A0
  status: observed
  evidence: >
    (slot, dst): file number = u16 table 0x801E2950[slot] (Sim 0x801E2EF0), then 0x8005D7B8. Slot 6 -> file 8
    (.crsinfo) at f467 from the boot block 0x80011C8C; slot 8 -> file 0x0C (.text/data-race.txd) at race load
    (f4410, from ovl0 0x80028C60).

- address: 0x80011F64
  name: race_overlay_entry
  overlay: ovl0
  sim_address: 0x80011F64
  status: observed
  evidence: >
    Entry used by ovl3 for the arcade race (0x8005DA48(0, 0x80011F64) at f4329). Same address as in the Sim build; the
    code differs in one call (race_load_strings, see the generated block).

- address: 0x800A9378
