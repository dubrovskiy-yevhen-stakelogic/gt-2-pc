- address: 0x801C9300
  name: race_settings
  sim_address: 0x801C98A0
  status: observed
  evidence: >
    Arcade race dump bytes +0x0C..+0x1C = 50 50 50 50 64 64 64 64 64 00 00 19 0A 04 0A 1E 08; the catch-up constants
    the race overlay derived from them (Sim 0x80046F6C.. = arcade 0x80046E8C..) are 0x400, 10 << 16, 4 * 0xA0000,
    409, 30 << 16, 8 * 0xA0000, 0x1000 = exactly the rule of catchup_tuning (Sim 0x80041E4C) for bytes +0x17..+0x1C
    and +0x14: catch-up AI is active in the arcade race. Shell byte 0x801D52C6 (Sim 0x801D5866, race mode) = 4.

- address: 0x80046D40
  name: race_tuning_raw
  overlay: ovl0
  sim_address: 0x80046E20
  status: verified
  evidence: >
    The raw tuning bytes race_tuning_expand_raw reads (Sim 0x80046E20, delta -0xE0): 168 bytes byte-identical to the Sim
    build. The EXE tables are identical too: gear auto table 0x800920DA (Sim 0x800923E2), sin 0x80092E48 (Sim
    0x80093150), cos 0x80093648, atan 0x800A47C0 (Sim 0x800A4AC8) - compared byte for byte on the two images.

- address: 0x800121DC
  name: arcade_race_build
  overlay: ovl3
  status: verified
  evidence: >
    The race launcher's race builder (our disassembly of ovl3): clears the race block 0x801D52BC (Sim 0x801D585C) and fills
    six 0xD0-byte entries from carparam/usa_arcade_data.dat - player: 0x80076ED0 (Sim 0x80076FC0 ConfigFromCarSpec) of its
    table-32 row; AI: 0x800767D0 + 0x80076E6C (Sim 0x800768C0 + 0x80076F5C OpponentCarConfig) of opponent rows drawn by
    0x80011EC0; grid 6 - (i + 1), kind 3 / 1; then 0x800770BC (Sim 0x800771AC) per entry into 0x801DE31A + i * 0x1C0. The
    arcade race dump's six entries equal these rules and records (gt2verify rows ArcadeEvent / ArcadeCars,
    docs/formats/arcade_data.md). CORRECTION 2026-09-19 (arcade_disc.md section 16): the arcade menus' race is built by
    member 2's instruction-identical copy 0x80010554 (session work\re\arcade_menu\s_calls: calls of 0x80076ED0 /
    0x80076E6C / 0x800770BC at f4228 come from ovl2 0x80010848..0x800109E8); ovl3 runs this copy only for a garage car
    (selection + 0x2C8 != 0, 0x8001290C), which the Single Player / Road Race flow never sets.

- address: 0x80011EC0
  name: arcade_opponent_draw
  overlay: ovl3
  status: observed
  evidence: >
    (entry, tables, event, &seed): 0x800839F0 task_random % 0x80078048 (Sim 0x80078138, used opponent slots), slot & 0xFFFF
    = opponent number, availability 0x80060A80 (Sim 0x80060B70), a 64-try budget against duplicates - the structure of the
    GT-mode picker 0x80010714 (ovl4). Seed = 0x8007D14C(0) (Sim 0x8007D23C, the VSync counter) at 0x800121DC.
    2026-09-19: the menus' race uses member 2's copy 0x80010238 (instruction-identical to Sim ovl4 0x80010714), verified
    against the original by gt2verify ArcadeBuild (300 random selections, all RAM compared, 0 mismatches).

- address: 0x8004269C
  name: update_wheel_effects
  overlay: ovl0
  sim_address: 0x800426F0
  status: verified
  evidence: >
    Instruction-equal to the Sim function modulo relocations up to the engine visuals (Arcade 0x80042FF4 sb v0,0x757(s6));
    then the epilogue (jr ra 0x80043020). The Sim tail 0x8004304C..0x800430D4 (contact type 2 && 0x800A951C == 0 && ...:
